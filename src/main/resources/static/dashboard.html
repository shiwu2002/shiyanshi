<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实验室预约系统 - 数据可视化大屏</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #0c1f3d 0%, #1a3a6e 100%);
            color: #fff;
            overflow-x: hidden;
            min-height: 100vh;
        }
        
        .header {
            text-align: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 2px solid #00d4ff;
        }
        
        .header h1 {
            font-size: 32px;
            background: linear-gradient(90deg, #00d4ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        
        .refresh-time {
            color: #88c0ff;
            font-size: 14px;
        }
        
        .container {
            max-width: 1920px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* 核心指标卡片 */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .metric-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(0, 212, 255, 0.3);
            transition: transform 0.3s;
        }
        
        .metric-card:hover {
            transform: translateY(-5px);
            border-color: #00d4ff;
        }
        
        .metric-value {
            font-size: 36px;
            font-weight: bold;
            background: linear-gradient(90deg, #00d4ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }
        
        .metric-label {
            font-size: 14px;
            color: #88c0ff;
        }
        
        /* 图表网格布局 */
        .charts-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .chart-container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 20px;
            border: 1px solid rgba(0, 212, 255, 0.2);
        }
        
        .chart-title {
            font-size: 18px;
            color: #00d4ff;
            margin-bottom: 15px;
            padding-left: 10px;
            border-left: 4px solid #00d4ff;
        }
        
        .chart-body {
            height: 350px;
            width: 100%;
        }
        
        /* 实时动态列表 */
        .activities-list {
            max-height: 350px;
            overflow-y: auto;
        }
        
        .activity-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 13px;
        }
        
        .activity-item:last-child {
            border-bottom: none;
        }
        
        .status-badge {
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
        }
        
        .status-0 { background: #ffa500; }  /* 待审核 */
        .status-1 { background: #00ff88; color: #000; }  /* 已通过 */
        .status-2 { background: #ff4444; }  /* 已拒绝 */
        .status-3 { background: #888; }  /* 已取消 */
        .status-4 { background: #00d4ff; color: #000; }  /* 已完成 */
        
        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #00d4ff;
            border-radius: 4px;
        }
        
        /* 加载动画 */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 350px;
            color: #00d4ff;
            font-size: 18px;
        }
        
        /* 响应式适配 */
        @media (max-width: 1400px) {
            .metrics-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            
            .charts-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔬 实验室预约系统数据可视化大屏</h1>
        <div class="refresh-time">最后更新：<span id="updateTime">-</span></div>
    </div>
    
    <div class="container">
        <!-- 核心指标卡片 -->
        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-value" id="totalUsers">-</div>
                <div class="metric-label">总用户数</div>
            </div>
            <div class="metric-card">
                <div class="metric-value" id="totalLabs">-</div>
                <div class="metric-label">实验室数量</div>
            </div>
            <div class="metric-card">
                <div class="metric-value" id="totalReservations">-</div>
                <div class="metric-label">总预约次数</div>
            </div>
            <div class="metric-card">
                <div class="metric-value" id="todayReservations">-</div>
                <div class="metric-label">今日预约</div>
            </div>
            <div class="metric-card">
                <div class="metric-value" id="pendingReservations">-</div>
                <div class="metric-label">待审核</div>
            </div>
            <div class="metric-card">
                <div class="metric-value" id="avgCreditScore">-</div>
                <div class="metric-label">平均信誉分</div>
            </div>
        </div>
        
        <!-- 第一行图表 -->
        <div class="charts-row">
            <div class="chart-container">
                <div class="chart-title">📈 预约趋势（最近 30 天）</div>
                <div id="trendChart" class="chart-body">
                    <div class="loading">加载中...</div>
                </div>
            </div>
            <div class="chart-container">
                <div class="chart-title">🏆 实验室利用率 TOP10</div>
                <div id="labRankChart" class="chart-body">
                    <div class="loading">加载中...</div>
                </div>
            </div>
        </div>
        
        <!-- 第二行图表 -->
        <div class="charts-row">
            <div class="chart-container">
                <div class="chart-title">🎯 预约状态分布</div>
                <div id="statusPieChart" class="chart-body">
                    <div class="loading">加载中...</div>
                </div>
            </div>
            <div class="chart-container">
                <div class="chart-title">⏰ 时间段热度分布</div>
                <div id="timeSlotChart" class="chart-body">
                    <div class="loading">加载中...</div>
                </div>
            </div>
        </div>
        
        <!-- 第三行图表 -->
        <div class="charts-row">
            <div class="chart-container">
                <div class="chart-title">👥 用户类型分布</div>
                <div id="userTypeChart" class="chart-body">
                    <div class="loading">加载中...</div>
                </div>
            </div>
            <div class="chart-container">
                <div class="chart-title">⭐ 信用等级分布</div>
                <div id="creditLevelChart" class="chart-body">
                    <div class="loading">加载中...</div>
                </div>
            </div>
        </div>
        
        <!-- 第四行：学院排行 + 实时动态 -->
        <div class="charts-row">
            <div class="chart-container">
                <div class="chart-title">🎓 学院预约 TOP10</div>
                <div id="collegeRankChart" class="chart-body">
                    <div class="loading">加载中...</div>
                </div>
            </div>
            <div class="chart-container">
                <div class="chart-title">🔔 实时动态</div>
                <div id="activitiesList" class="activities-list">
                    <div class="loading">加载中...</div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const API_BASE = 'http://localhost:8080/api/dashboard';
        
        // 初始化 ECharts 实例
        const charts = {};
        
        // 颜色方案
        const colors = ['#00d4ff', '#00ff88', '#ffa500', '#ff4444', '#88c0ff', '#ff69b4'];
        
        // 格式化数字
        function formatNumber(num) {
            return num >= 1000 ? (num / 1000).toFixed(1) + 'k' : num.toString();
        }
        
        // 更新时间
        function updateTime() {
            const now = new Date();
            document.getElementById('updateTime').textContent = 
                now.toLocaleString('zh-CN');
        }
        
        // 加载核心指标
        async function loadCoreMetrics() {
            try {
                const res = await fetch(`${API_BASE}/core-metrics`);
                const data = await res.json();
                
                if (data.code === 200) {
                    const metrics = data.data;
                    document.getElementById('totalUsers').textContent = formatNumber(metrics.totalUsers);
                    document.getElementById('totalLabs').textContent = formatNumber(metrics.totalLabs);
                    document.getElementById('totalReservations').textContent = formatNumber(metrics.totalReservations);
                    document.getElementById('todayReservations').textContent = formatNumber(metrics.todayReservations);
                    document.getElementById('pendingReservations').textContent = formatNumber(metrics.pendingReservations);
                    document.getElementById('avgCreditScore').textContent = metrics.avgCreditScore;
                }
            } catch (error) {
                console.error('加载核心指标失败:', error);
            }
        }
        
        // 加载预约趋势图
        async function loadTrendChart() {
            try {
                const res = await fetch(`${API_BASE}/reservation-trend`);
                const data = await res.json();
                
                if (data.code === 200 && data.data.length > 0) {
                    const dates = data.data.map(item => item.date);
                    const counts = data.data.map(item => item.count);
                    
                    charts.trend = echarts.init(document.getElementById('trendChart'));
                    charts.trend.setOption({
                        tooltip: { trigger: 'axis' },
                        xAxis: {
                            type: 'category',
                            data: dates,
                            axisLabel: { color: '#88c0ff', rotate: 45 }
                        },
                        yAxis: {
                            type: 'value',
                            axisLabel: { color: '#88c0ff' },
                            splitLine: { lineStyle: { color: 'rgba(255,255,255,0.1)' } }
                        },
                        series: [{
                            data: counts,
                            type: 'line',
                            smooth: true,
                            areaStyle: {
                                color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                    { offset: 0, color: 'rgba(0, 212, 255, 0.5)' },
                                    { offset: 1, color: 'rgba(0, 212, 255, 0)' }
                                ])
                            },
                            lineStyle: { color: '#00d4ff', width: 3 },
                            itemStyle: { color: '#00ff88' }
                        }]
                    });
                }
            } catch (error) {
                console.error('加载趋势图失败:', error);
            }
        }
        
        // 加载实验室排行图
        async function loadLabRankChart() {
            try {
                const res = await fetch(`${API_BASE}/lab-utilization`);
                const data = await res.json();
                
                if (data.code === 200 && data.data.length > 0) {
                    const names = data.data.map(item => item.lab_name);
                    const counts = data.data.map(item => item.reservation_count);
                    
                    charts.labRank = echarts.init(document.getElementById('labRankChart'));
                    charts.labRank.setOption({
                        tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
                        xAxis: {
                            type: 'value',
                            axisLabel: { color: '#88c0ff' },
                            splitLine: { lineStyle: { color: 'rgba(255,255,255,0.1)' } }
                        },
                        yAxis: {
                            type: 'category',
                            data: names.reverse(),
                            axisLabel: { color: '#88c0ff' }
                        },
                        series: [{
                            type: 'bar',
                            data: counts.reverse(),
                            itemStyle: {
                                color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
                                    { offset: 0, color: '#00d4ff' },
                                    { offset: 1, color: '#00ff88' }
                                ])
                            }
                        }]
                    });
                }
            } catch (error) {
                console.error('加载排行图失败:', error);
            }
        }
        
        // 加载状态分布饼图
        async function loadStatusPieChart() {
            try {
                const res = await fetch(`${API_BASE}/status-distribution`);
                const data = await res.json();
                
                if (data.code === 200 && data.data.length > 0) {
                    charts.statusPie = echarts.init(document.getElementById('statusPieChart'));
                    charts.statusPie.setOption({
                        tooltip: { trigger: 'item' },
                        legend: { orient: 'vertical', left: 'left', textStyle: { color: '#88c0ff' } },
                        series: [{
                            type: 'pie',
                            radius: ['40%', '70%'],
                            data: data.data.map((item, index) => ({
                                value: item.count,
                                name: item.status_name,
                                itemStyle: { color: colors[index % colors.length] }
                            })),
                            label: { color: '#fff' }
                        }]
                    });
                }
            } catch (error) {
                console.error('加载状态图失败:', error);
            }
        }
        
        // 加载时间段热力图
        async function loadTimeSlotChart() {
            try {
                const res = await fetch(`${API_BASE}/time-slot-heatmap`);
                const data = await res.json();
                
                if (data.code === 200 && data.data.length > 0) {
                    const slots = data.data.map(item => item.time_slot);
                    const counts = data.data.map(item => item.usage_count);
                    
                    charts.timeSlot = echarts.init(document.getElementById('timeSlotChart'));
                    charts.timeSlot.setOption({
                        tooltip: { trigger: 'axis' },
                        xAxis: {
                            type: 'category',
                            data: slots,
                            axisLabel: { color: '#88c0ff', rotate: 45 }
                        },
                        yAxis: {
                            type: 'value',
                            axisLabel: { color: '#88c0ff' },
                            splitLine: { lineStyle: { color: 'rgba(255,255,255,0.1)' } }
                        },
                        series: [{
                            type: 'bar',
                            data: counts,
                            itemStyle: {
                                color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                    { offset: 0, color: '#ffa500' },
                                    { offset: 1, color: '#ff4444' }
                                ])
                            }
                        }]
                    });
                }
            } catch (error) {
                console.error('加载时间段图失败:', error);
            }
        }
        
        // 加载用户类型分布
        async function loadUserTypeChart() {
            try {
                const res = await fetch(`${API_BASE}/user-type-distribution`);
                const data = await res.json();
                
                if (data.code === 200 && data.data.length > 0) {
                    charts.userType = echarts.init(document.getElementById('userTypeChart'));
                    charts.userType.setOption({
                        tooltip: { trigger: 'item' },
                        series: [{
                            type: 'pie',
                            radius: '70%',
                            data: data.data.map((item, index) => ({
                                value: item.count,
                                name: item.type_name,
                                itemStyle: { color: colors[index % colors.length] }
                            })),
                            label: { color: '#fff' }
                        }]
                    });
                }
            } catch (error) {
                console.error('加载用户类型图失败:', error);
            }
        }
        
        // 加载信用等级分布
        async function loadCreditLevelChart() {
            try {
                const res = await fetch(`${API_BASE}/credit-level-distribution`);
                const data = await res.json();
                
                if (data.code === 200 && data.data.length > 0) {
                    const levels = data.data.map(item => item.level_name);
                    const counts = data.data.map(item => item.count);
                    
                    charts.credit = echarts.init(document.getElementById('creditLevelChart'));
                    charts.credit.setOption({
                        tooltip: { trigger: 'axis' },
                        xAxis: {
                            type: 'category',
                            data: levels,
                            axisLabel: { color: '#88c0ff', rotate: 30 }
                        },
                        yAxis: {
                            type: 'value',
                            axisLabel: { color: '#88c0ff' },
                            splitLine: { lineStyle: { color: 'rgba(255,255,255,0.1)' } }
                        },
                        series: [{
                            type: 'bar',
                            data: counts,
                            itemStyle: {
                                color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                    { offset: 0, color: '#00d4ff' },
                                    { offset: 0.5, color: '#88c0ff' },
                                    { offset: 1, color: '#ff69b4' }
                                ])
                            }
                        }]
                    });
                }
            } catch (error) {
                console.error('加载信用图失败:', error);
            }
        }
        
        // 加载学院排行
        async function loadCollegeRankChart() {
            try {
                const res = await fetch(`${API_BASE}/college-rank`);
                const data = await res.json();
                
                if (data.code === 200 && data.data.length > 0) {
                    const colleges = data.data.map(item => item.college);
                    const counts = data.data.map(item => item.reservation_count);
                    
                    charts.college = echarts.init(document.getElementById('collegeRankChart'));
                    charts.college.setOption({
                        tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
                        xAxis: {
                            type: 'value',
                            axisLabel: { color: '#88c0ff' },
                            splitLine: { lineStyle: { color: 'rgba(255,255,255,0.1)' } }
                        },
                        yAxis: {
                            type: 'category',
                            data: colleges.reverse(),
                            axisLabel: { color: '#88c0ff' }
                        },
                        series: [{
                            type: 'bar',
                            data: counts.reverse(),
                            itemStyle: {
                                color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
                                    { offset: 0, color: '#88c0ff' },
                                    { offset: 1, color: '#00d4ff' }
                                ])
                            }
                        }]
                    });
                }
            } catch (error) {
                console.error('加载学院排行失败:', error);
            }
        }
        
        // 加载实时动态
        async function loadActivities() {
            try {
                const res = await fetch(`${API_BASE}/recent-activities`);
                const data = await res.json();
                
                if (data.code === 200 && data.data.length > 0) {
                    const container = document.getElementById('activitiesList');
                    container.innerHTML = data.data.map(item => `
                        <div class="activity-item">
                            <span>${item.user_name} 预约了 ${item.lab_name}</span>
                            <span class="status-badge status-${item.status}">${item.status_text}</span>
                        </div>
                    `).join('');
                }
            } catch (error) {
                console.error('加载动态失败:', error);
            }
        }
        
        // 主函数
        async function initDashboard() {
            await Promise.all([
                loadCoreMetrics(),
                loadTrendChart(),
                loadLabRankChart(),
                loadStatusPieChart(),
                loadTimeSlotChart(),
                loadUserTypeChart(),
                loadCreditLevelChart(),
                loadCollegeRankChart(),
                loadActivities()
            ]);
            
            updateTime();
            
            // 窗口大小变化时重绘图表
            window.addEventListener('resize', () => {
                Object.values(charts).forEach(chart => chart.resize());
            });
        }
        
        // 启动
        initDashboard();
        
        // 每 30 秒自动刷新
        setInterval(() => {
            loadCoreMetrics();
            loadActivities();
            updateTime();
        }, 30000);
    </script>
</body>
</html>
